name: filewizard
arch: amd64
platform: linux
version: 0.11.0
section: utils
priority: optional
maintainer: Kayab Software <kayab999@users.noreply.github.com>
description: |
  Local-first file classification and organization engine for Linux.
  Rule-based moves with dry-run, journal undo, cascade perception.
vendor: Kayab Software
homepage: https://github.com/kayab999/SmartFileWizard
license: MIT
depends:
  - libgl1
  - libxcb-xinerama0 | libxcb1
  - libxkbcommon0
  - libdbus-1-3
recommends:
  - tesseract-ocr
suggests:
  - llama-server
contents:
  - src: ./dist/FileWizard
    dst: /opt/filewizard
    type: dir
  - src: ./packaging/filewizard.desktop
    dst: /usr/share/applications/filewizard.desktop
    type: file
  - src: ./src/filewizard/ui/assets/app_icon_256.png
    dst: /usr/share/icons/hicolor/256x256/apps/filewizard.png
    type: file
  # compat symlinks in /usr/bin pointing to the unified binary
  - src: ./packaging/deb/bin-filewizard
    dst: /usr/bin/filewizard
    type: file
  - src: ./packaging/deb/bin-filewizard-ui
    dst: /usr/bin/filewizard-ui
    type: file
  - src: ./packaging/deb/bin-filewizard-mcp
    dst: /usr/bin/filewizard-mcp
    type: file
scripts:
  postinstall: ./packaging/deb/postinstall.sh
  postremove: ./packaging/deb/postremove.sh

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filewizard"
dynamic = ["version"]
description = "Rule-based file classification, organization and automation engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
images = [
    "pillow>=10.0",
]
ocr = [
    "pillow>=10.0",
    "pytesseract>=0.3.10",
]
zeroshot = [
    "pillow>=10.0",
    "torch>=2.0",
    "transformers>=4.40",
]
ui = [
    "PySide6>=6.6",
]
mcp = [
    "mcp>=2.0",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-qt>=4.4",
]
redos = [
    "regex>=2024.0",
]

[project.scripts]
filewizard = "filewizard.cli:cli"
filewizard-ui = "filewizard.ui.__main__:main"
filewizard-mcp = "filewizard.mcp:run_stdio"

[tool.setuptools.packages.find]
where = ["src"]
include = ["filewizard*"]

[tool.setuptools.dynamic]
version = {attr = "filewizard.__version__"}

[tool.setuptools.package-data]
filewizard = ["ui/assets/*", "ui/*.qss", "ui/i18n/*.qm", "ui/i18n/*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/filewizard --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.run]
omit = ["src/filewizard/ui/*"]

[tool.coverage.report]
fail_under = 50

name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 0.11.0); empty = from tag"
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libs (Qt/pytest-qt headless)
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Install (dev + ui + bounded regex engine)
        run: pip install -e ".[dev,ui,redos]"
      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PYEOF'
          import os, sys
          import pytest
          code = pytest.main(["-q"])
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(code)
          PYEOF
      - name: ruff
        run: pip install "ruff==0.15.15" && ruff check src/ tests/

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps (FUSE + desktop validation)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2 desktop-file-utils
      - name: Build AppImage
        env:
          SOURCE_DATE_EPOCH: 1735689600
        run: |
          bash packaging/appimage/build.sh
          ls -lh dist/*.AppImage
          sha256sum dist/*.AppImage
      - name: Smoke check (CLI inside AppImage)
        run: |
          chmod +x dist/*.AppImage
          dist/FileWizard-*.AppImage --appimage-extract-and-run --help || dist/FileWizard-*.AppImage --help
          dist/FileWizard-*.AppImage --appimage-extract-and-run --version || dist/FileWizard-*.AppImage --version
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install --quiet cyclonedx-bom
          cyclonedx-py environment --output-file dist/sbom.json
          test -s dist/sbom.json
          ls -lh dist/sbom.json
      - name: Sign artifacts (optional GPG)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No GPG_PRIVATE_KEY configured; skipping GPG signing."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in dist/*.AppImage; do
            [ -f "$f" ] && gpg --batch --yes --detach-sign --armor "$f"
          done
      - name: Sign artifacts (keyless cosign)
        run: |
          COSIGN_VERSION=v2.6.5
          curl -sSfL -o cosign_checksums.txt "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt"
          curl -sSfL -o cosign-linux-amd64 "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          # The manifest entry name must match the downloaded file name.
          grep ' cosign-linux-amd64$' cosign_checksums.txt | sha256sum -c -
          mv cosign-linux-amd64 cosign
          chmod +x cosign
          ./cosign version
          for f in dist/*.AppImage; do
            [ -f "$f" ] && ./cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
      - name: Upload appimage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appimage-dist
          path: |
            dist/*.AppImage
            dist/*.AppImage.bundle
            dist/*.asc
            dist/sbom.json
          if-no-files-found: error

  deb:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libs (Qt/pytest-qt headless)
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Build .deb (from PyInstaller one-dir)
        env:
          SOURCE_DATE_EPOCH: 1735689600
        run: |
          bash packaging/deb/build-deb.sh
          ls -lh dist/*.deb
          sha256sum dist/*.deb
      - name: Smoke check .deb
        run: |
          sudo dpkg -i dist/*.deb || sudo apt-get install -f -y
          echo "--- dpkg -L ---"
          dpkg -L filewizard | head -n 50
          echo "--- /opt/filewizard ---"
          ls -R /opt/filewizard | head -n 80
          ls -lh /opt/filewizard/FileWizard || true
          file /opt/filewizard/FileWizard || true
          echo "--- /usr/bin shims ---"
          ls -lh /usr/bin/filewizard* || true
          cat /usr/bin/filewizard || true
          echo "--- validate desktop ---"
          desktop-file-validate /usr/share/applications/filewizard.desktop || true
          echo "--- run filewizard --help ---"
          filewizard --help
          filewizard --version
          filewizard-ui --help || echo "ui help exit code $?"
      - name: Sign .deb (keyless cosign)
        run: |
          COSIGN_VERSION=v2.6.5
          curl -sSfL -o cosign_checksums.txt "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt"
          curl -sSfL -o cosign-linux-amd64 "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          grep ' cosign-linux-amd64$' cosign_checksums.txt | sha256sum -c -
          mv cosign-linux-amd64 cosign
          chmod +x cosign
          ./cosign version
          for f in dist/*.deb; do
            [ -f "$f" ] && ./cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-dist
          path: |
            dist/*.deb
            dist/*.deb.bundle
          if-no-files-found: error

  publish:
    needs: [appimage, deb]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify final artifact set
        run: |
          ls -lh dist/
          test -n "$(ls dist/*.AppImage 2>/dev/null)" || { echo "missing AppImage"; exit 1; }
          test -n "$(ls dist/*.deb 2>/dev/null)" || { echo "missing deb"; exit 1; }
          test -s dist/sbom.json
      - name: Generate and verify checksums
        run: |
          cd dist
          sha256sum *.AppImage *.deb sbom.json > SHA256SUMS
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v4
        with:
          files: |
            dist/*.AppImage
            dist/*.AppImage.bundle
            dist/*.deb
            dist/*.deb.bundle
            dist/*.asc
            dist/sbom.json
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: false

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 0.11.0); empty = from tag"
        required: false

permissions:
  contents: write
  # Keyless Sigstore signing (cosign) needs an OIDC token.
  id-token: write

jobs:
  # Verify before packaging — reuse the test matrix from test.yml but as a gate.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libs (Qt/pytest-qt headless)
        # Same as test.yml: PySide6 cannot even import conftest without
        # libEGL/libGL/libxkbcommon on the runner.
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Install (dev + ui + bounded regex engine)
        # Strict: no fallback — a failed Qt install must fail the release gate.
        run: pip install -e ".[dev,ui,redos]"
      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        # Same hard-exit pattern as test.yml: coverage and the gate are
        # finalized inside pytest.main(); os._exit() skips the interpreter
        # finalization where PySide6 can segfault after a green run.
        run: |
          python - <<'PYEOF'
          import os, sys
          import pytest
          code = pytest.main(["-q"])
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(code)
          PYEOF
      - name: ruff
        run: pip install "ruff==0.15.15" && ruff check src/ tests/

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (FUSE + desktop validation)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2 desktop-file-utils

      - name: Build AppImage
        env:
          # B2-3: reproducible-builds best effort — fixed epoch keeps file
          # mtimes inside the bundle deterministic for identical inputs.
          SOURCE_DATE_EPOCH: 1735689600
        run: |
          bash packaging/appimage/build.sh
          ls -lh dist/*.AppImage
          sha256sum dist/*.AppImage

      - name: Smoke check (CLI inside AppImage)
        run: |
          chmod +x dist/*.AppImage
          # --appimage-extract-and-run avoids needing FUSE in CI session
          dist/FileWizard-*.AppImage --appimage-extract-and-run --help || dist/FileWizard-*.AppImage --help
          dist/FileWizard-*.AppImage --appimage-extract-and-run --version || dist/FileWizard-*.AppImage --version

      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install --quiet cyclonedx-bom
          cyclonedx-py environment --output-file dist/sbom.json || true
          ls -lh dist/sbom.json 2>/dev/null || true

      - name: Sign artifacts (optional GPG)
        # `secrets` context is not allowed in step-level `if:`; guard inside
        # the script instead. Skips cleanly when no key is configured.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No GPG_PRIVATE_KEY configured; skipping GPG signing."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in dist/*.AppImage dist/*.deb; do
            [ -f "$f" ] && gpg --batch --yes --detach-sign --armor "$f"
          done

      - name: Sign artifacts (keyless cosign)
        run: |
          pip install --quiet cosign 2>/dev/null || true
          curl -sSfL -o cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign
          for f in dist/*.AppImage dist/*.deb; do
            [ -f "$f" ] && ./cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
          sha256sum dist/*.AppImage dist/*.deb dist/sbom.json 2>/dev/null > dist/SHA256SUMS || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/sbom.json
            dist/*.asc
            dist/*.sig
            dist/*.cert
            dist/*.bundle
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: false

  deb:
    needs: [test, appimage]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build .deb (from PyInstaller one-dir)
        env:
          SOURCE_DATE_EPOCH: 1735689600
        run: |
          bash packaging/deb/build-deb.sh
          ls -lh dist/*.deb
          sha256sum dist/*.deb
      - name: Smoke check .deb
        run: |
          sudo dpkg -i dist/*.deb || sudo apt-get install -f -y
          echo "--- dpkg -L ---"
          dpkg -L filewizard | head -n 50
          echo "--- /opt/filewizard ---"
          ls -R /opt/filewizard | head -n 80
          ls -lh /opt/filewizard/FileWizard || true
          file /opt/filewizard/FileWizard || true
          echo "--- /usr/bin shims ---"
          ls -lh /usr/bin/filewizard* || true
          cat /usr/bin/filewizard || true
          echo "--- validate desktop ---"
          desktop-file-validate /usr/share/applications/filewizard.desktop || true
          echo "--- run filewizard --help ---"
          filewizard --help
          filewizard --version
          filewizard-ui --help || echo "ui help exit code $?"
      - name: Upload .deb to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: false

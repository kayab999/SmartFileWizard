name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libs (Qt/pytest-qt headless)
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Install
        # No fallback: a failed `ui` install must fail the job here, not
        # later as ModuleNotFoundError inside the test suite.
        # `redos` activates the bounded `regex` engine (ADR-0006): CI runs
        # the real-timeout path, not only the stdlib fallback.
        run: pip install -e ".[dev,ui,redos]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Dump the Python stack if the interpreter crashes at teardown
          # (PySide6 shutdown-order segfaults have been observed on
          # runners; the stack pinpoints the leaking QObject).
          PYTHONFAULTHANDLER: 1
        # pytest.main() runs the full session (coverage data + report and
        # the cov-fail-under gate are finalized inside it, before it
        # returns); os._exit() then skips interpreter finalization, which
        # is where shiboken6/PySide6 can segfault after a green run.
        run: |
          python - <<'PYEOF'
          import os, sys
          import pytest
          code = pytest.main(["-q"])
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(code)
          PYEOF
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff==0.15.15"
      - name: Lint
        run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,ui]" mypy types-PyYAML
      - name: Type check (gate)
        run: mypy src/filewizard --ignore-missing-imports

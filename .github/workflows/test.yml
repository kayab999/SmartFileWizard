name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # No fallback: a failed `ui` install must fail the job here, not
        # later as ModuleNotFoundError inside the test suite.
        # `redos` activates the bounded `regex` engine (ADR-0006): CI runs
        # the real-timeout path, not only the stdlib fallback.
        run: pip install -e ".[dev,ui,redos]"
      - name: Test
        run: pytest -q
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff==0.15.15"
      - name: Lint
        run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,ui]" mypy types-PyYAML
      - name: Type check (gate)
        run: mypy src/filewizard --ignore-missing-imports
